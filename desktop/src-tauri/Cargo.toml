[package]
name = "zoggyfin-desktop"
version = "0.1.12"
description = "Zoggyfin desktop: the web app in a Tauri window, with libmpv for video"
license = "MPL-2.0"
repository = "https://github.com/zog-tech/zoggyfin"
homepage = "https://zoggyfin.zog-tech.com"
edition = "2021"
publish = false

[lib]
name = "zoggyfin_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-window-state = "2"
# Updates from a signed latest.json (src/update.rs).
tauri-plugin-updater = "2"
# One instance: a second start (Finder, `open -n`, a terminal) focuses the running window.
tauri-plugin-single-instance = "2"
# zoggyfin:// links (invite links) from the browser and other apps (src/links.rs).
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["fs", "io-util"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-open-gl = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-media-player = { version = "0.3", features = ["block2", "objc2-app-kit", "objc2-core-foundation"] }
block2 = "0.6"
# src/update.rs: the original path of a translocated app (Security framework).
core-foundation = "0.10"

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
# Never "abort": wry catches the Objective-C exception that WebKit throws for a cancelled
# request by unwinding through Rust frames. With "abort" the app quits there (an earlier
# Tauri app crashed so). src/lib.rs refuses to build a release with "abort".
panic = "unwind"
