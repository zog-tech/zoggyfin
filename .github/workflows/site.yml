name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when the Cloudflare token is not set
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Set the repository secret CLOUDFLARE_API_TOKEN to deploy the site."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
      # npx runs wrangler from the npm cache. wrangler-action installed it into the
      # repository, where the app's peer dependencies made npm fail.
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 pages deploy public --project-name zoggyfin-site --branch main --commit-dirty=true
