<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: transparent; }
  button { font: inherit; padding: 10px 14px; margin: 4px 4px 4px 0; border-radius: 10px; border: 1px solid #8884; background: #8881; }
  pre { white-space: pre-wrap; font-size: 12px; background: #8881; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<h2>Hello panel</h2>
<p>This page talks to the app through the bridge.</p>
<button id="ctx">getContext</button>
<button id="toast">toast</button>
<button id="refresh">refreshLibrary</button>
<button id="external">openExternal</button>
<button id="close">close</button>
<pre id="out">…</pre>
<script>
  // The bridge helper. It works in an iframe (web, Mac app) and in a WebView (iPhone, iPad, Android).
  const pending = new Map();
  let seq = 0;
  window.addEventListener('message', (e) => {
    const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (!d || d.zoggyfin !== 1 || !pending.has(d.id)) return;
    const p = pending.get(d.id);
    pending.delete(d.id);
    d.error ? p.reject(new Error(d.error)) : p.resolve(d.result);
  });
  function zoggyfin(method, params = {}) {
    return new Promise((resolve, reject) => {
      const id = ++seq;
      pending.set(id, { resolve, reject });
      const msg = { zoggyfin: 1, id, method, params };
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      else window.parent.postMessage(msg, '*');
    });
  }
  const out = document.getElementById('out');
  document.getElementById('ctx').onclick = async () => {
    const c = await zoggyfin('getContext');
    out.textContent = JSON.stringify(c, null, 2);
  };
  document.getElementById('toast').onclick = () => zoggyfin('toast', { text: 'Hello from the panel' });
  document.getElementById('refresh').onclick = () => zoggyfin('refreshLibrary');
  document.getElementById('external').onclick = async () => {
    const r = await zoggyfin('openExternal', { url: 'https://example.org/' });
    out.textContent = JSON.stringify(r);
  };
  document.getElementById('close').onclick = () => zoggyfin('close');
</script>
</body>
</html>
